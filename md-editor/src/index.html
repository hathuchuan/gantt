<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; style-src 'self' 'unsafe-inline' file:; img-src 'self' data: file: https:; script-src 'self'" />
  <title>Untitled</title>
  <link rel="stylesheet" href="vendor/katex.min.css" />
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="highlight.css" />
  <script src="theme-init.js"></script>
</head>
<body>
  <div id="titlebar"><span id="docname">Untitled</span><button id="docstatus" hidden></button></div>

  <button id="toggle" title="Preview (⌘/)" aria-label="Toggle preview">
    <svg class="i-eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
    <svg class="i-pen" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>
  </button>

  <div id="syn" aria-hidden="true"></div>
  <div id="hl" aria-hidden="true"></div>
  <div id="lint" aria-hidden="true"></div>
  <textarea id="editor" spellcheck="false" autocapitalize="off" placeholder="Start writing…  Type / for commands"></textarea>
  <article id="preview" hidden></article>
  <ul id="slash" role="listbox" hidden></ul>
  <ul id="wiki" role="listbox" hidden></ul>

  <div id="findbar" role="search" hidden>
    <input id="find-input" type="text" placeholder="Find" spellcheck="false" autocomplete="off" />
    <span id="find-count"></span>
    <button id="find-case" title="Match case" aria-pressed="false">Aa</button>
    <button id="find-prev" title="Previous (⇧Enter)" aria-label="Previous match">↑</button>
    <button id="find-next" title="Next (Enter)" aria-label="Next match">↓</button>
    <button id="find-close" title="Close (Esc)" aria-label="Close find">✕</button>
  </div>

  <aside id="side" hidden>
    <nav id="side-tabs">
      <button data-tab="outline">Outline</button>
      <button data-tab="search">Search</button>
      <button data-tab="links">Backlinks</button>
    </nav>
    <div id="side-body"></div>
  </aside>

  <div id="sheet" hidden>
    <div class="sheet-box" role="dialog" aria-labelledby="sheet-title">
      <header><h2 id="sheet-title"></h2><button id="sheet-close" aria-label="Close">✕</button></header>
      <div id="sheet-body"></div>
    </div>
  </div>
  <div id="fmtbar" role="toolbar" aria-label="Text formatting" hidden></div>
  <div id="fmtpop" hidden></div>
  <div id="problems" hidden>
    <header><strong id="pb-title"></strong><button id="pb-close" aria-label="Hide problems">✕</button></header>
    <ul id="pb-list"></ul>
  </div>
  <div id="toast" hidden></div>

  <script src="vendor/marked.umd.js"></script>
  <script src="vendor/purify.min.js"></script>
  <script src="vendor/katex.min.js"></script>
  <script src="vendor/highlight.min.js"></script>
  <script src="vendor/turndown.umd.js"></script>
  <script src="vendor/turndown-plugin-gfm.js"></script>
  <script src="html2md.js"></script>
  <script src="math.js"></script>
  <script src="formats.js"></script>
  <script src="syntax.js"></script>
  <script src="editing.js"></script>
  <script src="notes-core.js"></script>
  <script src="app.js"></script>
  <script src="panels.js"></script>
</body>
</html>
