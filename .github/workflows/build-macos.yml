name: Build macOS app

on:
  push:
    branches: ['**']
    paths-ignore: ['**.md']
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build app + DMG
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          if [ -n "$RELEASE_TAG" ]; then export VERSION="${RELEASE_TAG#v}"; fi
          ./macos/build.sh

      - name: Self-test (mở app, kiểm tra cầu nối JS, ghi dữ liệu, sao lưu, nhật ký)
        timeout-minutes: 3
        run: '"macos/build/Academic Gantt.app/Contents/MacOS/AcademicGantt" --self-test'

      - name: Kiểm thử tắt / mở lại app (thoát êm, đóng cửa sổ, kill -9, tệp hỏng, tải lại trang)
        timeout-minutes: 10
        run: bash macos/tests/persist.sh "macos/build/Academic Gantt.app" direct

      - name: Kiểm thử tắt / mở lại app qua LaunchServices (giống bấm đúp trong Finder)
        timeout-minutes: 10
        continue-on-error: true
        run: bash macos/tests/persist.sh "macos/build/Academic Gantt.app" open

      - name: Kiểm thử chạy thẳng từ DMG (ổ đĩa chỉ đọc, như khi chưa kéo app vào Applications)
        timeout-minutes: 10
        continue-on-error: true
        run: |
          MNT="$(mktemp -d)"
          hdiutil attach macos/build/AcademicGantt-*.dmg -nobrowse -readonly -mountpoint "$MNT"
          ls -la "$MNT"
          "$MNT/Academic Gantt.app/Contents/MacOS/AcademicGantt" --self-test
          bash macos/tests/persist.sh "$MNT/Academic Gantt.app" direct
          hdiutil detach "$MNT" -force

      - uses: actions/upload-artifact@v4
        with:
          name: AcademicGantt-macOS
          path: macos/build/*.dmg
          if-no-files-found: error

      - name: Đính kèm DMG vào Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: macos/build/*.dmg
